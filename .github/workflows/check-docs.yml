name: Check docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Windows is included because link letter-case checks differ on
    # case-insensitive filesystems.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the document checker
        run: node --test tools/check-docs.test.mjs
      - name: Check links, anchors and ID-named files
        run: node tools/check-docs.mjs
