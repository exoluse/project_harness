name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Runtime self-tests on the bare template
        run: python scripts/check_repo.py full --self-test
      - name: A copied template becomes a project by command only
        run: |
          python scripts/harness.py init . --project-id CI --name "CI smoke"
          python scripts/harness.py next
          python scripts/check_repo.py full
